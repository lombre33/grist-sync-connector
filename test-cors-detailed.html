<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test CORS Détaillé - Grist Sync</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { margin-bottom: 10px; font-size: 28px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .content {
            padding: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: monospace;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
            margin-top: 30px;
        }
        button {
            padding: 14px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 2px solid #e0e0e0;
        }
        .btn-secondary:hover {
            background: #efefef;
        }
        .results {
            margin-top: 30px;
            border-top: 2px solid #e0e0e0;
            padding-top: 30px;
        }
        .test-result {
            margin-bottom: 25px;
            padding: 15px;
            border-left: 4px solid #ddd;
            background: #f9f9f9;
            border-radius: 4px;
        }
        .test-result.success {
            border-left-color: #4caf50;
            background: #f1f8f6;
        }
        .test-result.error {
            border-left-color: #f44336;
            background: #fdf1f1;
        }
        .test-result.warning {
            border-left-color: #ff9800;
            background: #fff8f1;
        }
        .test-result h3 {
            margin-bottom: 10px;
            font-size: 16px;
            color: #333;
        }
        .test-result p {
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.6;
            color: #666;
        }
        .test-result code {
            display: block;
            background: white;
            padding: 12px;
            border-radius: 4px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 8px;
            border: 1px solid #e0e0e0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            margin-left: 10px;
        }
        .status-ok {
            background: #4caf50;
            color: white;
        }
        .status-error {
            background: #f44336;
            color: white;
        }
        .status-warning {
            background: #ff9800;
            color: white;
        }
        .header-list {
            font-size: 12px;
            color: #666;
        }
        .header-list li {
            margin-left: 20px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Test CORS Détaillé</h1>
            <p>Introspection complète du chemin API Grist</p>
        </div>
        
        <div class="content">
            <div class="form-group">
                <label>Instance Grist (URL)</label>
                <input type="text" id="instance" value="https://grist.numerique.gouv.fr" placeholder="https://grist.numerique.gouv.fr">
            </div>

            <div class="form-group">
                <label>ID du Document Source</label>
                <input type="text" id="docId" value="97yiWFtwrJMV" placeholder="ex: 97yiWFtwrJMV">
            </div>

            <div class="form-group">
                <label>Nom de la Table</label>
                <input type="text" id="tableName" value="Table1" placeholder="ex: Table1">
            </div>

            <div class="form-group">
                <label>Clé API (compte de service)</label>
                <input type="password" id="apiKey" placeholder="Colle ta clé API ici (pas visible)">
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="testGetDocInfo()">
                    📋 1. Infos Document
                </button>
                <button class="btn-primary" onclick="testGetTables()">
                    📊 2. Lister Tables
                </button>
                <button class="btn-primary" onclick="testGetTableRecords()">
                    📈 3. Récupérer Enregistrements
                </button>
                <button class="btn-secondary" onclick="clearResults()">
                    🗑️ Effacer Résultats
                </button>
            </div>

            <div class="results" id="results" style="display: none;">
                <h2>📊 Résultats</h2>
                <div id="resultsList"></div>
            </div>
        </div>
    </div>

    <script>
        function addResult(title, status, details) {
            const resultsList = document.getElementById('resultsList');
            const resultsContainer = document.getElementById('results');
            resultsContainer.style.display = 'block';

            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${status}`;
            
            let statusBadge = '';
            if (status === 'success') statusBadge = '<span class="status-badge status-ok">✓ Succès</span>';
            else if (status === 'error') statusBadge = '<span class="status-badge status-error">✗ Erreur</span>';
            else if (status === 'warning') statusBadge = '<span class="status-badge status-warning">⚠ Attention</span>';

            resultDiv.innerHTML = `
                <h3>${title}${statusBadge}</h3>
                ${details}
            `;
            resultsList.appendChild(resultDiv);
        }

        function clearResults() {
            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = '';
            document.getElementById('results').style.display = 'none';
        }

        async function makeRequest(method, url, apiKey) {
            const fullUrl = apiKey ? `${url}?api_key=${encodeURIComponent(apiKey)}` : url;
            
            let details = `<p><strong>URL complète :</strong></p><code>${fullUrl}</code>`;
            details += `<p style="margin-top: 10px;"><strong>Méthode :</strong> ${method}</p>`;

            try {
                const response = await fetch(fullUrl, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                const contentType = response.headers.get('content-type');
                let body = '';
                if (contentType && contentType.includes('application/json')) {
                    body = await response.json();
                } else {
                    body = await response.text();
                }

                details += `<p style="margin-top: 10px;"><strong>Code HTTP :</strong> ${response.status}</p>`;
                details += `<p><strong>Headers CORS :</strong></p><ul class="header-list">`;
                details += `<li>Access-Control-Allow-Origin: ${response.headers.get('access-control-allow-origin') || 'N/A'}</li>`;
                details += `<li>Access-Control-Allow-Headers: ${response.headers.get('access-control-allow-headers') || 'N/A'}</li>`;
                details += `<li>Access-Control-Allow-Methods: ${response.headers.get('access-control-allow-methods') || 'N/A'}</li>`;
                details += `</ul>`;
                
                if (response.ok) {
                    details += `<p style="margin-top: 10px;"><strong>Réponse (body) :</strong></p><code>${JSON.stringify(body, null, 2)}</code>`;
                    addResult(arguments[3], 'success', details);
                    return { success: true, data: body, status: response.status };
                } else {
                    details += `<p style="margin-top: 10px;"><strong>Erreur :</strong></p><code>${typeof body === 'string' ? body : JSON.stringify(body, null, 2)}</code>`;
                    addResult(arguments[3], 'error', details);
                    return { success: false, error: body, status: response.status };
                }
            } catch (err) {
                details += `<p style="margin-top: 10px;"><strong>Exception réseau :</strong></p><code>${err.message}</code>`;
                addResult(arguments[3], 'error', details);
                return { success: false, error: err.message };
            }
        }

        async function testGetDocInfo() {
            const instance = document.getElementById('instance').value;
            const docId = document.getElementById('docId').value;
            const apiKey = document.getElementById('apiKey').value;

            clearResults();
            const url = `${instance}/api/docs/${docId}`;
            await makeRequest('GET', url, apiKey, '📋 Récupérer infos du document');
        }

        async function testGetTables() {
            const instance = document.getElementById('instance').value;
            const docId = document.getElementById('docId').value;
            const apiKey = document.getElementById('apiKey').value;

            clearResults();
            const url = `${instance}/api/docs/${docId}/tables`;
            await makeRequest('GET', url, apiKey, '📊 Lister toutes les tables');
        }

        async function testGetTableRecords() {
            const instance = document.getElementById('instance').value;
            const docId = document.getElementById('docId').value;
            const tableName = document.getElementById('tableName').value;
            const apiKey = document.getElementById('apiKey').value;

            clearResults();
            const url = `${instance}/api/docs/${docId}/tables/${encodeURIComponent(tableName)}/records`;
            await makeRequest('GET', url, apiKey, '📈 Récupérer enregistrements de la table');
        }
    </script>
</body>
</html>
